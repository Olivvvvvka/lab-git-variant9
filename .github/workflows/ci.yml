name: CI for copy_file.py

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pytest flake8

      - name: Show files (debug)
        run: ls -la && ls -la tests/

      - name: Lint with flake8
        run: |
          flake8 . --max-line-length=120 --exclude=.git,__pycache__,venv,.github

      - name: Run tests (with path fix)
        run: |
          python -c "
import sys, os; sys.path.insert(0, os.getcwd());
from tests.test_copy_file import test_safe_copy_success, test_safe_copy_file_not_found;
test_safe_copy_success();
test_safe_copy_file_not_found();
"