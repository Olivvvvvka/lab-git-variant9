name: CI for copy_file.py

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install pytest flake8
      - name: Lint
        run: flake8 . --max-line-length=120 --exclude=.git,__pycache__,venv,.github
      - name: Test
        run: pytest tests/ -v